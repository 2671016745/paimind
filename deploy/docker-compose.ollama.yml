# Ollama 容器化部署 — 一条命令起服务，App 连 http://localhost:11434/v1
#
# 用法：
#   docker compose -f deploy/docker-compose.ollama.yml up -d
#   docker compose -f deploy/docker-compose.ollama.yml ps      # 确认 healthy
#   ollama pull qwen2.5:1.5b                                   # 首次拉模型
#
# App 侧无需改动：engines.ollama.base_url 默认就是 http://localhost:11434。
# GPU 直通：Linux + NVIDIA 需要 nvidia-container-toolkit，加 deploy.resources。

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # 纯 CPU 机器保持默认；有 NVIDIA GPU 时取消下一行注释
      # NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_HOST: "0.0.0.0"
    # 有 NVIDIA GPU + Linux 时启用（需 nvidia-container-toolkit）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  ollama-data:
