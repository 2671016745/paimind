[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paimind"
version = "0.0.1"
description = "应急食品 · 本地小模型决策助手（桌面 / 移动 / HTTP API）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "paimind" }]
keywords = ["llm", "onnx", "decision", "local-first", "rag"]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.setuptools]
packages = ["core", "core.inference", "server", "server.routes", "desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
